name: A listing does not run
description: A script in the repository fails, prints the wrong thing, or cannot be installed.
title: "chN listing — "
labels: ["code"]
body:
  - type: markdown
    attributes:
      value: |
        The five facts below are what makes a report reproducible. The book asks for the
        same five in *Conventions and Getting Help*.
  - type: input
    id: chapter
    attributes:
      label: Chapter
      placeholder: "7"
    validations:
      required: true
  - type: input
    id: listing
    attributes:
      label: Listing
      description: The path under the repository root, or the folder plus the file name.
      placeholder: "chapter7/advanced_application_script/example/files/01_marketing_crew.py"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: shell
      placeholder: ".venv/bin/python run_offline.sh  # or the single file"
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or output
      description: The last 30 lines are enough, but include the error line itself.
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Python and OS
      placeholder: "3.12.4 on macOS 15.2 / 3.11.9 on Windows 11"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Gateway
      description: The base URL you pointed OPENAI_COMPATIBLE_BASE_URL at, if the listing calls a model. Never paste the key.
      placeholder: "https://openrouter.ai/api/v1"
  - type: textarea
    id: freeze
    attributes:
      label: pip freeze (optional)
      render: shell
      placeholder: ".venv/bin/python -m pip freeze"
